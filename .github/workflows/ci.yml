name: CI
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Verify migration registry
        run: npm run check:migration-registry

      - name: Build
        run: npm run build

  brevo-care-webhook:
    name: Signed Brevo Care Webhook E2E
    runs-on: ubuntu-latest
    # This job intentionally uses the configured Aiven integration database:
    # the spec provisions UUID-scoped fixtures and removes them in afterAll.
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      BREVO_WEBHOOK_SECRET: ${{ secrets.BREVO_WEBHOOK_SECRET }}
      BASE_URL: http://127.0.0.1:5000
      NODE_ENV: production
      PORT: '5000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify webhook E2E secrets are configured
        run: |
          missing=""
          [ -z "$AIVEN_DATABASE_URL" ] && missing="$missing AIVEN_DATABASE_URL"
          [ -z "$BREVO_WEBHOOK_SECRET" ] && missing="$missing BREVO_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::error ::Missing GitHub Actions secrets:$missing"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start backend with signed webhook authentication
        run: |
          npm run dev > brevo-care-webhook-server.log 2>&1 &
          echo $! > brevo-care-webhook-server.pid

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$BASE_URL/health" >/dev/null; then
              echo "Backend is ready on $BASE_URL"
              break
            fi
            if ! kill -0 "$(cat brevo-care-webhook-server.pid)" 2>/dev/null; then
              echo "::error ::Backend exited before becoming ready"
              cat brevo-care-webhook-server.log
              exit 1
            fi
            sleep 2
          done

          if ! curl --fail --silent --show-error "$BASE_URL/health" >/dev/null; then
            echo "::error ::Backend did not become ready within 120 seconds"
            cat brevo-care-webhook-server.log
            exit 1
          fi

      - name: Run signed Brevo Customer Care webhook E2E
        run: npx playwright test tests/brevo-care-webhook.spec.ts --project=chromium

      - name: Stop backend
        if: always()
        run: |
          if [ -f brevo-care-webhook-server.pid ]; then
            kill "$(cat brevo-care-webhook-server.pid)" 2>/dev/null || true
            for attempt in {1..10}; do
              kill -0 "$(cat brevo-care-webhook-server.pid)" 2>/dev/null || break
              sleep 1
            done
          fi

      - name: Upload webhook E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brevo-care-webhook-e2e-${{ github.run_id }}
          path: |
            brevo-care-webhook-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  integrity-preview:
    name: PostgreSQL ${{ matrix.postgres-version }} Integrity & Migration Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the isolation regression aligned with the PostgreSQL majors
        # supported by the application environments.
        postgres-version: ['14', '15', '16']
    env:
      # This database exists only inside the ephemeral GitHub Actions job.
      # The test creates and drops its own schema inside it; no production
      # connection or data is used.
      INTEGRITY_PG_URL: postgresql://postgres:postgres@localhost:5432/integrity_preview
      INTEGRITY_PG_SSL: 'false'
      POSTGRES_VERSION: ${{ matrix.postgres-version }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: integrity_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d integrity_preview"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL ${{ matrix.postgres-version }} tenant-isolation regression
        run: |
          set -o pipefail
          echo "Running tenant-isolation regression against PostgreSQL ${POSTGRES_VERSION}"
          npm run test:tenant-isolation 2>&1 | tee "tenant-isolation-postgres-${POSTGRES_VERSION}.log"

      - name: Upload PostgreSQL ${{ matrix.postgres-version }} tenant-isolation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-postgres-${{ matrix.postgres-version }}
          path: tenant-isolation-postgres-${{ matrix.postgres-version }}.log
          if-no-files-found: error

      - name: Run PostgreSQL integrity and migration checks
        run: >-
          npx vitest run
          --config vitest.server.config.ts
          server/test/integrityMigrationPreview.pg.int.test.ts

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  pr-view:
    name: PR Info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: View PR details via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Pull Request Details ==="
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json number,title,author,state,body,labels,reviewDecision,additions,deletions,changedFiles \
            --jq '
              "PR #\(.number): \(.title)",
              "Author: \(.author.login)",
              "State: \(.state)",
              "Changed files: \(.changedFiles) (+\(.additions) -\(.deletions))",
              "Labels: \([ .labels[].name ] | join(", "))",
              "Review: \(.reviewDecision // "PENDING")"
            '

      - name: Show PR diff stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Changed Files ==="
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --name-only
