name: CI
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  overview-release:
    name: Overview Responsive Release Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify browser runtime before Overview suite
        run: node scripts/verify-playwright-runtime.mjs

      - name: Start application
        run: |
          PORT=5000 npm run dev > /tmp/overview-application.log 2>&1 &
          echo $! > /tmp/overview-application.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not become ready for the Overview release checks."
          cat /tmp/overview-application.log
          exit 1

      - name: Run Overview responsive release checks
        run: npm run test:e2e:overview

      - name: Upload Overview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-responsive-${{ github.run_id }}
          path: |
            test-results/overview/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  pr-view:
    name: PR Info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: View PR details via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Pull Request Details ==="
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json number,title,author,state,body,labels,reviewDecision,additions,deletions,changedFiles \
            --jq '
              "PR #\(.number): \(.title)",
              "Author: \(.author.login)",
              "State: \(.state)",
              "Changed files: \(.changedFiles) (+\(.additions) -\(.deletions))",
              "Labels: \([ .labels[].name ] | join(", "))",
              "Review: \(.reviewDecision // "PENDING")"
            '

      - name: Show PR diff stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Changed Files ==="
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --name-only
