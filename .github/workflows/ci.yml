name: CI
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check router extraction schema contract
        run: npm run check:router-schema

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  distributed-chat-regression:
    name: Distributed chat Redis outage regression
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgs_chat_distributed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sgs_chat_distributed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      AIVEN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sgs_chat_distributed
      SOCKET_IO_REDIS_URL: redis://127.0.0.1:6379
      DB_POOL_MAX: '2'
      DB_DISABLE_SSL: '1'
      NODE_ENV: test
      CI: true
      CHAT_ROOMS_DISTRIBUTED_REQUIRED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run distributed chat outage regression
        run: npx vitest run --config vitest.server.config.ts server/test/chatRoomsRoutes.distributed.pg.int.test.ts

  facebook-album-contract:
    name: Facebook album provider contract
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Facebook album contract smoke
        run: npm run test:facebook-album-contract

  connector-regression:
    name: Social connector browser regression
    runs-on: ubuntu-latest
    needs: build
    # The database-backed fixture is deliberately not exposed to forked PRs.
    # Pushes and same-repository PRs run the authenticated browser regression.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_POOL_MAX: '4'
      CI: true
      PLAYWRIGHT_START_SERVER: '1'
      BASE_URL: http://127.0.0.1:5000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify E2E secrets
        run: |
          missing=""
          [ -z "$AIVEN_DATABASE_URL" ] && missing="$missing AIVEN_DATABASE_URL"
          [ -z "$JWT_SECRET" ] && missing="$missing JWT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error ::Missing CI secrets:$missing"
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run social connector regression
        run: npx playwright test tests/social-connections.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-connector-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  public-livechat-security:
    name: Public live-chat security smoke
    runs-on: ubuntu-latest
    needs: build
    # Forked PRs cannot access the external fixture secret. The local command
    # still reports that case as SKIPPED when it is run outside release mode.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      DB_POOL_MAX: '2'
      CI: true
      LIVECHAT_SECURITY_SMOKE_MODE: release
      PLAYWRIGHT_START_SERVER: '1'
      BASE_URL: http://127.0.0.1:5000
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Run public live-chat security smoke
        run: npm run test:livechat-security

      - name: Upload live-chat Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-livechat-security-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  pr-view:
    name: PR Info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: View PR details via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Pull Request Details ==="
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json number,title,author,state,body,labels,reviewDecision,additions,deletions,changedFiles \
            --jq '
              "PR #\(.number): \(.title)",
              "Author: \(.author.login)",
              "State: \(.state)",
              "Changed files: \(.changedFiles) (+\(.additions) -\(.deletions))",
              "Labels: \([ .labels[].name ] | join(", "))",
              "Review: \(.reviewDecision // "PENDING")"
            '

      - name: Show PR diff stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Changed Files ==="
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --name-only
