name: CI
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Deployed origin to verify (overrides the DEPLOYMENT_URL repository variable)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  overview-release:
    name: Overview Responsive Release Checks
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify browser runtime before Overview suite
        run: node scripts/verify-playwright-runtime.mjs

      - name: Start application
        run: |
          PORT=5000 npm run dev > /tmp/overview-application.log 2>&1 &
          echo $! > /tmp/overview-application.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Application did not become ready for the Overview release checks."
          cat /tmp/overview-application.log
          exit 1

      - name: Run Overview responsive release checks
        run: npm run test:e2e:overview

      - name: Upload Overview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-responsive-${{ github.run_id }}
          path: |
            test-results/overview/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  overview-deployed:
    name: Overview Responsive Deployed Build
    runs-on: ubuntu-latest
    needs: build
    # Configure DEPLOYMENT_URL as a repository variable for push/PR checks, or
    # provide deployment_url when manually dispatching this workflow.
    if: ${{ inputs.deployment_url != '' || vars.DEPLOYMENT_URL != '' }}
    env:
      BASE_URL: ${{ inputs.deployment_url || vars.DEPLOYMENT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Record deployment target
        run: |
          printf 'deployment_url=%s\ncommit=%s\nworkflow=%s\nrun_id=%s\n' \
            "$BASE_URL" "$GITHUB_SHA" "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" \
            > deployment-url.txt

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Verify browser runtime before deployed Overview suite
        run: node scripts/verify-playwright-runtime.mjs

      - name: Verify deployed build reachability
        run: |
          if ! curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 "$BASE_URL/" \
            -o /tmp/overview-deployed-home.html; then
            echo "::error title=Deployment reachability::The configured deployment URL could not be reached: $BASE_URL"
            exit 1
          fi
          echo "Deployment reachable: $BASE_URL"

      - name: Run Overview responsive checks against deployed build
        run: |
          if ! npx playwright test --project=overview-desktop --project=overview-tablet --project=overview-mobile; then
            echo "::error title=Overview assertion::The deployed origin was reachable and the browser started, but an Overview responsive check failed."
            exit 1
          fi

      - name: Upload deployed Overview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-responsive-deployed-${{ github.run_id }}
          path: |
            deployment-url.txt
            test-results/overview/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  overview-compare:
    name: Compare Overview Evidence
    runs-on: ubuntu-latest
    needs: [overview-release, overview-deployed]
    if: ${{ always() && needs.overview-release.result == 'success' && needs.overview-deployed.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download local Overview evidence
        uses: actions/download-artifact@v4
        with:
          name: overview-responsive-${{ github.run_id }}
          path: evidence/local

      - name: Download deployed Overview evidence
        uses: actions/download-artifact@v4
        with:
          name: overview-responsive-deployed-${{ github.run_id }}
          path: evidence/deployed

      - name: Compare local and deployed Overview evidence
        run: |
          node scripts/compare-overview-evidence.mjs \
            --local evidence/local \
            --deployed evidence/deployed \
            --thresholds .github/overview-visual-thresholds.json \
            --exceptions .github/overview-visual-exceptions.json

      - name: Upload Overview comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-responsive-comparison-${{ github.run_id }}
          path: overview-comparison/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  pr-view:
    name: PR Info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: View PR details via gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Pull Request Details ==="
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json number,title,author,state,body,labels,reviewDecision,additions,deletions,changedFiles \
            --jq '
              "PR #\(.number): \(.title)",
              "Author: \(.author.login)",
              "State: \(.state)",
              "Changed files: \(.changedFiles) (+\(.additions) -\(.deletions))",
              "Labels: \([ .labels[].name ] | join(", "))",
              "Review: \(.reviewDecision // "PENDING")"
            '

      - name: Show PR diff stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Changed Files ==="
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --name-only
