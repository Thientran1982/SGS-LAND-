# Nginx config — sgsland.vn
# Copy to: /etc/nginx/sites-available/sgsland.vn
# Then: sudo ln -s /etc/nginx/sites-available/sgsland.vn /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name sgsland.vn www.sgsland.vn;
    return 301 https://sgsland.vn$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sgsland.vn www.sgsland.vn;

    # SSL — Certbot managed
    ssl_certificate     /etc/letsencrypt/live/sgsland.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgsland.vn/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # www → non-www
    if ($host = 'www.sgsland.vn') {
        return 301 https://sgsland.vn$request_uri;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options "nosniff"                       always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                 always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Static assets — aggressive caching
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images
    location /images/ {
        alias /var/www/sgsland-nextjs/public/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Socket.io passthrough to Express
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # All other requests → Next.js
    location / {
        proxy_pass         http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Max upload size
    client_max_body_size 10M;
}
