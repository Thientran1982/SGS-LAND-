<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ngoai tuyen | SGS LAND</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:#0f172a; color:#e2e8f0; display:flex; min-height:100vh;
      align-items:center; justify-content:center; text-align:center; padding:24px; }
    .card { max-width:420px; }
    h1 { font-size:1.6rem; margin:0 0 12px; }
    p { color:#94a3b8; line-height:1.6; margin:0 0 20px; }
    button { background:#f97316; color:#fff; border:0; border-radius:10px;
      padding:12px 22px; font-size:1rem; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bạn đang ngoại tuyến</h1>
    <p>Không có kết nối mạng. Vui lòng kiểm tra kết nối Internet và thử lại. Các trang đã xem gần đây vẫn có thể truy cập.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
